<h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Catégories</h3>
<ul class="space-y-1">
    {% for category in categories %}
    <li>
        <a href="{% url 'catalog:product_list' %}?category={{ category.slug }}" class="block py-2 px-3 rounded-lg text-gray-700 hover:bg-amber-50 hover:text-amber-700 transition text-sm">
            {{ category.name }}
        </a>
    </li>
    {% empty %}
    <li class="text-gray-400 text-sm">Aucune catégorie.</li>
    {% endfor %}
</ul>
