{% load static %}
<!-- 1-Step COD Checkout Modal -->
<div id="checkout-modal" class="fixed inset-0 z-[70] hidden">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" data-close-checkout></div>
    <div class="absolute top-4 left-4 right-4 bottom-4 sm:top-8 sm:bottom-auto sm:h-[85vh] max-w-md mx-auto bg-white rounded-2xl shadow-2xl flex flex-col">
        <div class="p-6 border-b flex justify-between items-center gap-3">
            <h2 class="text-xl font-bold text-gray-900">Commander &mdash; Paiement &agrave; la livraison</h2>
            <button data-close-checkout class="text-gray-400 hover:text-gray-600 text-2xl" aria-label="Fermer">✕</button>
        </div>

        <form hx-post="{% url 'orders:checkout' %}" hx-target="#checkout-result" hx-swap="innerHTML" class="flex-1 overflow-y-auto p-6 space-y-4">
            {% csrf_token %}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="ck-name">Nom complet</label>
                    <input id="ck-name" type="text" name="full_name" required autocomplete="name"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="ck-phone">T&eacute;l&eacute;phone (8 chiffres)</label>
                    <input id="ck-phone" type="tel" name="phone" pattern="[0-9]{8}" required maxlength="8" autocomplete="tel"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-sm">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="ck-email">Email (optionnel)</label>
                    <input id="ck-email" type="email" name="email" autocomplete="email"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-sm">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="ck-gov">Gouvernorat</label>
                    <select id="ck-gov" name="governorate" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-sm">
                        {% for code, name in governorates %}
                        <option value="{{ code }}">{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="ck-delegation">D&eacute;l&eacute;gation / Ville</label>
                    <input id="ck-delegation" type="text" name="delegation" required autocomplete="address-level2"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-sm">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="ck-address">Adresse d&eacute;taill&eacute;e</label>
                    <textarea id="ck-address" name="address" rows="3" required autocomplete="street-address"
                              class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-sm"></textarea>
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="ck-notes">Note pour le vendeur (optionnel)</label>
                    <input id="ck-notes" type="text" name="notes" placeholder="Ex: appeler avant 18h"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-sm">
                </div>
            </div>

            <div id="checkout-result" class="mb-4"></div>

            <div class="pt-4 border-t sticky bottom-0 bg-white">
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white px-8 py-3.5 rounded-xl font-bold text-lg shadow-lg transition flex items-center justify-center gap-2">
                    Passer la commande <span>&rarr;</span>
                </button>
                <p class="text-center text-xs text-gray-500 mt-3">Paiement &agrave; la livraison &bull; Confirmation t&eacute;l&eacute;phonique sous 24h</p>
            </div>
        </form>
    </div>
</div>
