{% load static %}
<!-- 1-Step COD Checkout Modal -->
<div id="checkout-modal" class="fixed inset-0 z-[70] hidden">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="document.getElementById('checkout-modal').classList.add('hidden')"></div>
    <div class="absolute top-4 left-4 right-4 max-w-md mx-auto bg-white rounded-2xl shadow-2xl flex flex-col h-[85vh]">
        <div class="p-6 border-b flex justify-between items-center">
            <h2 class="text-xl font-bold text-gray-900">Commander &mdash; Paiement &agrave; la livraison</h2>
            <button onclick="document.getElementById('checkout-modal').classList.add('hidden')" class="text-gray-400 hover:text-gray-600 text-2xl">✕</button>
        </div>

        <form hx-post="{% url 'orders:checkout' %}" hx-target="#checkout-result" hx-swap="innerHTML" class="flex-1 overflow-y-auto p-6 space-y-6">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nom complet</label>
                    <input type="text" name="full_name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">T&e9l&e9phone (8 chiffres)</label>
                    <input type="tel" name="phone" pattern="[0-9]{8}" required maxlength="8" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email (optionnel)</label>
                    <input type="email" name="email" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-sm">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Gouvernorat</label>
                    <select name="governorate" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-sm">
                        {% for code, name in governorates %}
                        <option value="{{ code }}">{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">D&e9l&e9gation / Ville</label>
                    <input type="text" name="delegation" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-sm">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Adresse d&e9taill&e9e</label>
                    <textarea name="address" rows="3" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-sm"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Montant total (DT)</label>
                    <input type="number" name="total_amount" step="0.001" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none text-sm">
                </div>
            </div>

            <div id="checkout-result" class="mb-4"></div>

            <div class="pt-4 border-t">
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white px-8 py-3.5 rounded-xl font-bold text-lg shadow-lg transition flex items-center justify-center gap-2">
                    Passer la commande <span>&rarr;</span>
                </button>
                <p class="text-center text-xs text-gray-500 mt-3">Paiement &agrave; la livraison &bull; Confirmation t&e9l&e9phonique sous 24h</p>
            </div>
        </form>
    </div>
</div>

<script>
// Validate Tunisian phone: exactly 8 digits
document.querySelectorAll('input[name="phone"]').forEach(input => {
    input.addEventListener('input', function () {
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 8);
    });
});
</script>
