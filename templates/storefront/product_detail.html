{% extends "base.html" %}
{% block title %}{{ product.title }} &mdash; Karthago Commerce{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-lg shadow border p-6">
        <h1 class="text-2xl font-bold mb-4">{{ product.title }}</h1>
        <p class="text-gray-600 mb-4">{{ product.description }}</p>
        <div class="flex items-center gap-4 mb-6">
            <span class="text-2xl font-bold text-amber-700">{{ product.retail_price }} TND</span>
            <span class="text-gray-500">Stock: {{ product.stock }}</span>
        </div>
        <button class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-3 rounded-lg font-medium" onclick="location.href='{% url 'orders:checkout' %}'">
            Buy Now (COD)
        </button>
    </div>
</div>
{% endblock %}
