apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dropship-route
  labels:
    app: dropship-web
  annotations:
    haproxy.router.openshift.io/timeout: 60s
spec:
  to:
    kind: Service
    name: dropship-web-svc
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
