apiVersion: apps/v1
kind: Deployment
metadata:
  name: dropship-web
  labels:
    app: dropship-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dropship-web
  template:
    metadata:
      labels:
        app: dropship-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: django-app
          image: image-registry.openshift-image-registry.svc:5000/saif711-dev/dropship-app:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: dropship-config
            - secretRef:
                name: dropship-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /healthz/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz/
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
