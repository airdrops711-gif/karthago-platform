apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: dropship-app-build
  labels:
    app: karthago-platform
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/airdrops711-gif/karthago-platform.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: dropship-app:latest
  triggers:
    - type: ConfigChange
    - type: ImageChange
